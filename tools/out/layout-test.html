<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;height:100%}
.page{height:100vh;display:flex;flex-direction:column;overflow:hidden;font-family:sans-serif}
.header{flex-shrink:0}
.header-bar{display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;padding-left:12px}
.brand{display:flex;align-items:center;flex:1;min-width:0}
.brand-logo{width:24px;height:24px;background:#2b332d;color:#f5f3ec;font-size:13px;display:flex;align-items:center;justify-content:center;border-radius:4px;margin-right:6px;flex-shrink:0}
.brand-text{display:flex;flex-direction:column;min-width:0}
.brand-name{font-size:14px;font-weight:600;color:#2b332d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:7.5px;color:#8a8d84;letter-spacing:1px}
.header-actions{display:flex;align-items:center;gap:5px;flex-shrink:0}
.hbtn{display:flex;flex-direction:column;align-items:center;padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.55);font-size:10.5px;color:#4b4f49;line-height:1.3;white-space:nowrap}
.hbtn-en{font-size:7.5px;color:#9a9d94}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
canvas{position:absolute;left:0;top:0}
.panel{flex-shrink:0;height:260px;box-sizing:content-box;background:#f2f0e9;border-radius:12px 12px 0 0;padding-bottom:34px}
.panel-tabs{display:flex;padding:5px 12px 0}
.ptab{display:flex;flex-direction:column;align-items:center;padding:7px 15px 6px;font-size:13px;color:#8a8d84;line-height:1.3;border-bottom:2px solid transparent}
.ptab.on{color:#2b332d;font-weight:600;border-bottom-color:#2b332d}
.ptab-en{font-size:8px;color:#a9aca2}
.cats{display:flex;gap:8px;padding:9px 12px 3px}
.cat{display:flex;flex-direction:column;align-items:center;padding:5px 15px;border-radius:999px;background:rgba(255,255,255,.7);font-size:12px;color:#6d7068}
.cat.on{background:#3a3f3a;color:#f5f3ec}
.cat-en{font-size:7.5px;color:#a9aca2}
.catalog{white-space:nowrap;padding:7px 6px 9px;box-sizing:border-box;overflow-x:auto}
.card{position:relative;display:inline-flex;flex-direction:column;align-items:center;width:84px;margin:0 4px;padding:8px 4px 6px;background:#fbfaf5;border-radius:8px;vertical-align:top}
.card-img{width:74px;height:84px;background:#eee}
.card-name{font-size:12px;color:#2b332d;margin-top:4px}
</style></head>
<body>
<div class="page">
  <div class="header" style="padding-top:59px">
    <div class="header-bar" style="height:44px;padding-right:102px">
      <div class="brand"><div class="brand-logo">花</div>
        <div class="brand-text"><div class="brand-name">一束花</div><div class="brand-sub">FLOWER ARRANGING</div></div></div>
      <div class="header-actions">
        <div class="hbtn"><div>背景</div><div class="hbtn-en">Light</div></div>
        <div class="hbtn"><div>重新开始</div><div class="hbtn-en">Start over</div></div>
        <div class="hbtn"><div>完成作品</div><div class="hbtn-en">Finish</div></div>
      </div>
    </div>
  </div>
  <div class="stage"><canvas id="scene"></canvas></div>
  <div class="panel">
    <div class="panel-tabs">
      <div class="ptab on"><div>选花材</div><div class="ptab-en">Flowers</div></div>
      <div class="ptab"><div>调整花材</div><div class="ptab-en">Adjust</div></div>
      <div class="ptab"><div>容器</div><div class="ptab-en">Vases</div></div>
    </div>
    <div class="cats"><div class="cat on"><div>主花</div><div class="cat-en">Main</div></div>
      <div class="cat"><div>配花</div><div class="cat-en">Fillers</div></div>
      <div class="cat"><div>叶材</div><div class="cat-en">Foliage</div></div></div>
    <div class="catalog">
      <div class="card"><div class="card-img"></div><div class="card-name">玫瑰</div></div>
      <div class="card"><div class="card-img"></div><div class="card-name">洋桔梗</div></div>
      <div class="card"><div class="card-img"></div><div class="card-name">康乃馨</div></div>
      <div class="card"><div class="card-img"></div><div class="card-name">郁金香</div></div>
    </div>
  </div>
</div>
<script src="./preview-bundle.js"></script>
<script>
var ctx0 = null;
const r = new __modules['renderer'].SceneRenderer();
const items=[
 {id:1,type:'rose',color:0,h:300,a:14,x:330,variant:0,scale:1.1,tone:.03,bend:.8,knee:.2},
 {id:2,type:'peony',color:0,h:262,a:-16,x:330,variant:0,scale:.98,tone:-.02,bend:-.7,knee:.1},
];
const stage = document.querySelector('.stage');
const rect = stage.getBoundingClientRect();
const w = Math.round(rect.width), h = Math.round(rect.height);
const cv = document.getElementById('scene');
cv.width = w * 2; cv.height = h * 2;
cv.style.width = w + 'px'; cv.style.height = h + 'px';
const ctx = cv.getContext('2d');
const dpr = 2;
const scale = Math.min(w/660, h/720);
const offX = (w - 660*scale)/2, offY = (h - 720*scale)/2;
ctx.setTransform(1,0,0,1,0,0);
ctx.fillStyle='#d8d8d8'; ctx.fillRect(0,0,cv.width,cv.height);
ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*offX,dpr*offY);
r.render(ctx,{items,selected:null,vase:'classic',vaseColor:'ivory',backgroundColor:'default'});
setTimeout(()=>r.render(ctx,{items,selected:null,vase:'classic',vaseColor:'ivory',backgroundColor:'default'}),1200);
console.log('stage rect', w, h, 'scale', scale.toFixed(3), 'scene px', (660*scale).toFixed(0), (720*scale).toFixed(0));
</script>
</body></html>
