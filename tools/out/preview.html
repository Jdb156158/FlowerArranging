  drawPiece(ctx, kind, x, y, width) {

      const hh = i.h - cyOff;
      const hx = i.x + Math.sin(rad) * hh;
      const hy = base - Math.cos(rad) * hh;
      const key = assetKey(i.type, i.color, i.variant);
